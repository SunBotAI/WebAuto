# 智谱 AI GLM Coding 套餐抢购配置示例
# 用法:  cp config.example.yaml config.yaml  然后编辑

# NTP 服务器,用于时间校准(留空则自动选最快的)
ntp_server: ""
ntp_sync_times: 5
ntp_max_drift_ms: 200

# HTTP 请求超时
request_timeout_s: 10

# 代理(留空则直连)
proxy: ""

# 加密凭证库文件路径(口令通过 GLM_GRABBER_KEY 环境变量传入)
secret_store: ".secrets.enc"

# 通知配置
notification:
  type: "none"          # wechat / dingtalk / telegram / sound / none
  webhook: ""

# 重试策略
retry:
  times: 3
  delay_ms: 200
  backoff_factor: 1.6
  on_429_wait_ms: 2000

# ===== 自适应重试策略 (qtaxm/glm-rush 风格) =====
adaptive_retry:
  burst_count: 20          # 前 N 次零延迟爆发
  quick_count: 10          # 接下来 N 次快速重试 (quick_retry_ms 间隔)
  quick_retry_ms: 30       # 快速重试间隔
  slow_retry_ms: 100       # 慢速重试基础间隔
  jitter_pct: 0.3          # 慢速重试 ± 30% 抖动
  max_total_attempts: 60   # 兜底硬上限
  use_preview_check_mode: true  # True=qtaxm 模式, False=原 batch-preview 模式

# ===== 账号列表 =====
accounts:
  - name: "主账号"
    phone: "138xxxxxxxx"
    # cookie / token 二选一,从浏览器 F12 抓 Authorization 头 或 Cookie
    token: ""
    cookie: ""
    enabled: true

# ===== 目标套餐(legacy 单组;v5.x 推荐改用 plan_groups) =====
# 留空/不填时,启动时会自动折叠成 1 个默认组(行为与改前一致)。
# 如果填了 plan_groups,以下 4 个字段会被忽略(由 plan_groups 接管)。
target_plan: "Max"          # Lite / Pro / Max
target_plans: ["Max", "Pro"] # 优先级降级,Max 抢不到自动试 Pro
billing_cycle: "yearly"     # monthly / quarterly / yearly
pay_channel: "alipay"       # alipay / weChat_pay / balance_pay
use_pinhaomo: false

# ===== 多套餐配置(plan_groups,v5.x) =====
# 每组是一组独立的抢购配置:同账号 token 复用,共享 NTP 校准 + 预热,
# 但每组有独立的 target_plan / billing_cycle / pay_channel / use_pinhaomo。
# 点 [开始抢] 后所有 enabled=True 的组并发执行(组间不阻塞,组内 max_concurrent 限账号并发)。
#
# 与 legacy 字段(target_plan/billing_cycle/pay_channel)互斥:
#   - plan_groups 非空 → 走多组路径,旧字段被忽略
#   - plan_groups 为空 → 自动从旧字段折叠成 1 个默认组(向后兼容)
#
# 字段说明:
#   name                  组名(日志/UI 区分用,同实例内不可重复)
#   target_plan           Lite / Pro / Max
#   billing_cycle         monthly / quarterly / yearly
#   pay_channel           alipay / weChat_pay / balance_pay / public_pay
#   use_pinhaomo          true/false,是否使用拼好模
#   product_id            (可选)直接指定 productId,绕过 batch-preview
#   enabled               true/false,本组是否参与本次抢购
#   fallback_within_group 组内降级顺序(高→低),如 ["Pro", "Lite"]
#   notes                 备注(描述这组配置的用途)
#
# 示例(并发抢 Max/年/支付宝 和 Lite/月/余额):
# plan_groups:
#   - name: "Max年付"
#     target_plan: "Max"
#     billing_cycle: "yearly"
#     pay_channel: "alipay"
#     use_pinhaomo: true
#     fallback_within_group: ["Pro"]
#     enabled: true
#     notes: "主力配置"
#   - name: "Lite月付"
#     target_plan: "Lite"
#     billing_cycle: "monthly"
#     pay_channel: "balance_pay"
#     use_pinhaomo: false
#     enabled: true
#     notes: "保底配置"
plan_groups: []  # 留空 = 用上方 legacy 字段折叠成单组

# ===== 抢购时间(ISO8601) =====
# 留空则启动后立即执行一次 grab(适合测试流程)
target_time: ""

# 浏览器备用方案(强反爬场景)
browser_mode: false

# 开售前多少秒开始预热连接
preheat_seconds: 5

# 多账号并发上限
max_concurrent: 4